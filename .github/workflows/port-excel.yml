name: AnHiepLuc - port 37 column product Excel exports
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview target patch or push an Azure-only branch and create PR'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - apply
  issues:
    types: [opened]
permissions:
  contents: read
  issues: read
concurrency:
  group: anhiepluc-azure-product-export-port
  cancel-in-progress: false
jobs:
  port:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.issue.user.login == 'ngocnhanvo' &&
           github.event.sender.login == 'ngocnhanvo' &&
           (github.event.issue.title == '[anhiepluc:port-excel-preview]' ||
            github.event.issue.title == '[anhiepluc:port-excel-apply]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Port and test private Azure exports without logging source
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          PORT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.issue.title == '[anhiepluc:port-excel-apply]' && 'apply' || 'preview') }}
        run: python3 scripts/port_excel_from_anco1.py
