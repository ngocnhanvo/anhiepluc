name: AnHiepLuc - PLAN10 report revenue systems guarded patch
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Validate patch script
        run: python3 -m py_compile scripts/patch_plan10_revenue_data_56_58.py
      - name: Verify deployed PLAN-10 mapping (read-only preview)
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          REPORT_PATCH_MODE: preview
        run: python3 scripts/patch_plan10_revenue_data_56_58.py
