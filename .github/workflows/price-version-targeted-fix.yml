name: AnHiepLuc price version targeted fix
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  fix:
    if: >-
      ${{ github.event.issue.user.login == 'ngocnhanvo' &&
          github.event.sender.login == 'ngocnhanvo' &&
          (github.event.issue.title == '[anhiepluc:price-fix-preview]' ||
           github.event.issue.title == '[anhiepluc:price-fix-apply]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Python script
        run: python3 -m py_compile scripts/fix_price_version_internal_transfer.py
      - name: Patch source guarded by Azure master SHA
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          PRICE_FIX_MODE: ${{ github.event.issue.title == '[anhiepluc:price-fix-apply]' && 'apply' || 'preview' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix_price_version_internal_transfer.py | tee "$RUNNER_TEMP/price_fix_result.txt"
      - name: Report status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/price_fix_result.txt"; then
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file "$RUNNER_TEMP/price_fix_result.txt"
          fi
