name: AnHiepLuc SQL readonly lookup
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  query:
    if: >-
      ${{ github.event.issue.user.login == 'ngocnhanvo' &&
          github.event.sender.login == 'ngocnhanvo' &&
          github.event.issue.title == '[anhiepluc:sql-readonly]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install query dependencies
        run: python -m pip install -q 'pymssql>=2.3,<3' 'cryptography>=43,<50'
      - name: Select data using existing SQL secrets
        env:
          DB_SERVER: ${{ secrets.ANHIEPLUC_SQL_SERVER }}
          DB_USER: ${{ secrets.ANHIEPLUC_SQL_USER }}
          DB_PASSWORD: ${{ secrets.ANHIEPLUC_SQL_PASSWORD }}
          DB_DATABASE: ${{ secrets.ANHIEPLUC_SQL_DATABASE }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sql_readonly_lookup.py
