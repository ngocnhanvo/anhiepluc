name: AHL - read-only price logic and integration map
on:
  push:
    paths:
      - .github/workflows/audit-order-price-logic.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Analyze Azure source without printing private source bodies
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,base64,subprocess,tempfile,pathlib,collections
          env=os.environ.copy()
          t=env.get('AZURE_DEVOPS_PAT')
          if not t:raise RuntimeError('PAT_NOT_CONFIGURED')
          env['AZURE_GIT_HEADER']='AUTHORIZATION: Basic '+base64.b64encode((':'+t).encode()).decode()
          with tempfile.TemporaryDirectory() as td:
            root=pathlib.Path(td)/'src'
            p=subprocess.run(['git','--config-env=http.extraheader=AZURE_GIT_HEADER','clone','--quiet','--depth=1','--branch','master','https://dev.azure.com/vongocnhancd10cntt2/AnHiepLuc/_git/AnHiepLuc',str(root)],env=env,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=420)
            if p.returncode:raise RuntimeError('AZURE_CLONE_FAILED')
            targets=[
              'eman_ver3/Controller/PublicFunction/API_GuiNhanDonHang.ashx',
              'eman_ver3/Controller/JQGridModify/JQGridMD_00_TatCaDonHangModify.ashx',
              'eman_ver3/Controller/JQGrid/JQGridMD_00_TatCaDonHangLoad.ashx',
              'eman_ver3/js/Module_script/MD_00_TatCaDonHang.js',
              'eman_ver3/View/Menu/Content/Module/MD_00_TatCaDonHang.aspx',
              'eman_ver3/App_Code/vnnhan00000/API_SyncData_Execute.cs',
              'eman_ver3/Controller/JQGridModify/JQGridMD_00_BangGiaJQGSModify.ashx',
              'eman_ver3/Controller/JQGridModify/JQGridMD_01_PhienBangGiaJQGSModify.ashx'
            ]
            pats={
              'label_giaahl':re.compile('giá\\s*ahl|gia\\s*ahl|giaahl|gia_ahl',re.I),
              'label_giaanco':re.compile('giá\\s*anco|gia\\s*anco|giaanco|gia_anco',re.I),
              'ancotrading':re.compile('ancotrading|anco trading|_ancotrading',re.I),
              'ancoprice_table':re.compile('md_giasanpham_ancotrading|md_banggia_ancotrading',re.I),
              'receive_send':re.compile('gui.?don|nhan.?don|gui.?nhan|nhan.?hang|chuyen.?don',re.I),
              'price_lookup':re.compile('giasanpham|banggia|phienbangia|laygia|gia_ban|gia_mua',re.I),
              'price_validation':re.compile('gia\\s*(?:==|<=|!=|>=|<|>)\\s*0|gia\\s*[=!<>]=?\\s*0|gia\\s+is\\s+null|don.?gia\\s*[=!<>]=?\\s*0',re.I),
              'price_general':re.compile('(?<![a-z])(?:gia|giá|giafob|giaban|giamua|dongia|don_gia|price)(?![a-z])',re.I),
              'order_receipt':re.compile('hieuluc|tiepnhan|trienkhai|hoatdong|status|trangthai|da.?nhan',re.I)
            }
            meta=[]
            for f in root.rglob('*'):
              if f.is_file() and f.suffix.lower() in ('.cs','.ashx','.js','.aspx','.sql') and '.git' not in f.parts and f.stat().st_size<1100000:
                s=f.read_text(encoding='utf-8-sig',errors='replace')
                categories=[tag for tag,p in pats.items() if tag!='price_general' and p.search(s)]
                strong=[x for x in ('label_giaahl','label_giaanco','ancoprice_table','price_validation','ancotrading','receive_send') if x in categories]
                if strong: meta.append((str(f.relative_to(root)),strong))
            print('GLOBAL_PRICE_INTEGRATION_MATCHES_BEGIN')
            for path,cats in meta[:150]:print('FILE='+path+'; MATCH='+','.join(cats))
            print('GLOBAL_PRICE_INTEGRATION_MATCHES_END; COUNT='+str(len(meta)))
            for rel in targets:
              f=root/rel
              if not f.is_file():
                print('TARGET_MISSING='+rel);continue
              s=f.read_text(encoding='utf-8-sig',errors='replace')
              lines=s.splitlines()
              print('TARGET_BEGIN='+rel+'; LINES='+str(len(lines)))
              for tag,p in pats.items():
                hits=[i+1 for i,line in enumerate(lines) if p.search(line)]
                print('CATEGORY='+tag+'; COUNT='+str(len(hits))+'; LINES='+','.join(map(str,hits[:38])))
              tbl=set(re.findall(r'\b(?:md|c|ad)_[A-Za-z0-9_]+\b',s,re.I))
              print('TABLE_REFERENCES='+','.join(sorted(tbl)[:70]))
              methods=[]
              for i,line in enumerate(lines,1):
                hit=re.search(r'\b(?:public|private|protected|internal)\s+(?:static\s+)?(?:async\s+)?[\w<>\[\],?]+\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(',line)
                if hit: methods.append(str(i)+':'+hit.group(1))
              print('METHODS='+','.join(methods[:90]))
              for i,line in enumerate(lines,1):
                if not (pats['label_giaahl'].search(line) or pats['label_giaanco'].search(line) or pats['ancoprice_table'].search(line) or pats['price_validation'].search(line)):
                  continue
                identifiers=set(re.findall(r'\b[A-Za-z_][A-Za-z0-9_]{2,}\b',line))
                tokens=[x for x in sorted(identifiers) if any(v in x.lower() for v in ('gia','price','donhang','banggia','anco','trangthai','hieuluc','soluong','phien','sanpham','get','load','update','insert','select'))]
                operators=[op for op in ('===','!==','==','!=','<=','>=','<','>','&&','||','=','IS NULL','IsNull') if op in line]
                print('MATCH_LINE='+str(i)+'; TOKENS='+','.join(tokens[:24])+'; OPS='+','.join(operators[:10]))
              print('TARGET_END='+rel)
            print('AHL_PRICE_LOGIC_MAP=COMPLETE')
          PY
