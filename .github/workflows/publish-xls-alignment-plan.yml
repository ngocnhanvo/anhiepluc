name: AnHiepLuc - publish XLS alignment plan to Azure
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: read
jobs:
  publish:
    if: >-
      ${{ github.event.issue.user.login == 'ngocnhanvo' &&
          github.event.sender.login == 'ngocnhanvo' &&
          github.event.issue.title == '[anhiepluc:publish-plan-41col]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Commit planning markdown ONLY to Azure branch and open PR
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        shell: python
        run: |
          import base64, json, os, pathlib, subprocess, tempfile, urllib.request, urllib.error
          pat=os.getenv('AZURE_DEVOPS_PAT')
          if not pat: raise RuntimeError('AZURE_PAT_NOT_SET')
          secret='AUTHORIZATION: Basic '+base64.b64encode((':'+pat).encode()).decode()
          env=os.environ.copy();env['AZURE_AUTH_HEADER']=secret
          remote='https://dev.azure.com/vongocnhancd10cntt2/AnHiepLuc/_git/AnHiepLuc'
          src=pathlib.Path('plans/AnHiepLuc_Product_Export_41_Column_Alignment_PLAN.md')
          if not src.is_file(): raise RuntimeError('PLAN_NOT_FOUND')
          new_content=src.read_bytes()
          branch='ai/plan-excel-template-41-columns-20261025'
          dst='docs/MD_00_DSHangHoaVG_Excel_41_Column_Alignment_PLAN.md'
          def git(*args,cwd=None):
              p=subprocess.run(['git',*args],cwd=cwd,env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if p.returncode: raise RuntimeError('GIT_OPERATION_FAILED')
              return p.stdout.decode('utf-8','replace').strip()
          with tempfile.TemporaryDirectory() as tmp:
              repo=pathlib.Path(tmp)/'azure'
              git('--config-env=http.extraheader=AZURE_AUTH_HEADER','clone','--quiet','--depth=1',remote,str(repo))
              if git('branch','--show-current',cwd=repo)!='master':
                  raise RuntimeError('WRONG_MASTER')
              base=git('rev-parse','HEAD',cwd=repo)
              dest=repo/dst;dest.parent.mkdir(parents=True,exist_ok=True)
              if dest.is_file() and dest.read_bytes()==new_content:
                  print('PLAN_ALREADY_PRESENT=YES; MASTER='+base)
                  raise SystemExit(0)
              refs=git('--config-env=http.extraheader=AZURE_AUTH_HEADER','ls-remote','--heads','origin',branch,cwd=repo)
              if refs: raise RuntimeError('PLAN_BRANCH_EXISTS__NO_OVERWRITE')
              dest.write_bytes(new_content)
              git('checkout','-b',branch,cwd=repo)
              git('config','user.name','AnHiepLuc Automation',cwd=repo)
              git('config','user.email','37570235+ngocnhanvo@users.noreply.github.com',cwd=repo)
              git('add','--',dst,cwd=repo)
              if git('diff','--cached','--name-only',cwd=repo)!=dst:
                  raise RuntimeError('UNEXPECTED_STAGED_PATHS')
              git('commit','-m','docs: plan alignment to 41-column XLS product template',cwd=repo)
              sha=git('rev-parse','HEAD',cwd=repo)
              git('--config-env=http.extraheader=AZURE_AUTH_HEADER','push','origin','HEAD:refs/heads/'+branch,cwd=repo)
              api='https://dev.azure.com/vongocnhancd10cntt2/AnHiepLuc/_apis/git/repositories/AnHiepLuc/pullrequests?api-version=7.1'
              payload=json.dumps({'sourceRefName':'refs/heads/'+branch,'targetRefName':'refs/heads/master',
                'title':'Documentation only: AnHiepLuc 41-column XLS template alignment plan',
                'description':'Planning document only (41 physical columns, 37 visible, 4 hidden). No export code changes; implementation requires a separate task after schema/source verification.'}).encode()
              req=urllib.request.Request(api,method='POST',data=payload,
                headers={'Authorization':'Basic '+base64.b64encode((':'+pat).encode()).decode(),
                         'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=40) as f: pr=json.load(f)
              except urllib.error.HTTPError as e:
                  print('PLAN_BRANCH_PUSH=PASS; AZURE_COMMIT='+sha)
                  raise RuntimeError('PR_CREATION_HTTP_'+str(e.code)) from None
              print('PLAN_BRANCH_PUSH=PASS')
              print('PLAN_COMMIT='+sha)
              print('PLAN_PR_ID='+str(pr.get('pullRequestId')))
              print('PLAN_ONLY=YES; MASTER_UNCHANGED=YES')
