name: AnHiepLuc - inspect PLAN-10 headings read-only
on:
  push:
    paths:
      - .github/workflows/inspect-plan10-headings.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Locate report layout and displayed column labels
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,base64,pathlib,subprocess,tempfile,re
          token=os.environ.get('AZURE_DEVOPS_PAT','')
          if not token: raise RuntimeError('NO_PAT')
          env=os.environ.copy()
          env['AZURE_GIT_HEADER']='AUTHORIZATION: Basic '+base64.b64encode((':'+token).encode()).decode()
          with tempfile.TemporaryDirectory() as d:
              root=pathlib.Path(d)/'src'
              p=subprocess.run(['git','--config-env=http.extraheader=AZURE_GIT_HEADER','clone','--depth=1','--branch=master','--quiet','https://dev.azure.com/vongocnhancd10cntt2/AnHiepLuc/_git/AnHiepLuc',str(root)],env=env,stderr=subprocess.PIPE)
              if p.returncode: raise RuntimeError('AZURE_CLONE_FAILED')
              sha=subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()
              print('MASTER_SHA='+sha)
              files=[f for f in root.rglob('*') if f.is_file() and '.git' not in f.parts]
              targets=[f for f in files if any(t in f.name.lower() for t in ['baocaothdoanhthutheoddh','baocaothdoanhthu'])]
              print('REPORT_FILES='+str(len(targets)))
              for f in targets[:45]:
                  rel=f.relative_to(root)
                  print('TARGET='+str(rel)+'; SIZE='+str(f.stat().st_size))
                  if f.stat().st_size<200000:
                      raw=f.read_bytes()
                      for enc in ('utf-8-sig','utf-16','cp1258'):
                          try: text=raw.decode(enc);break
                          except UnicodeDecodeError:pass
                      else:continue
                      for n,line in enumerate(text.splitlines(),1):
                          labels=re.findall(r'(?<!\d)(?:81\s*\(\s*CH\s*\)|64|56|58)(?!\d)',line,re.I)
                          if labels and not re.search(r'ma_sanpham|sl_dathang|substring',line,re.I):
                              print('TITLE_CANDIDATE='+str(rel)+':'+str(n)+'; labels='+','.join(labels)+'; LINE_CHARS='+str(len(line))+'; nearby_markup='+','.join(re.findall(r'<([A-Za-z][\w:-]+)',line)[:5]))
              labels=['81 (CH)','81(CH)','81  (CH)','>64<','>81','c81CH','c64','PLAN-10']
              for f in files:
                  if f.suffix.lower() not in {'.cs','.aspx','.ascx','.js','.xml','.rdl','.repx','.rdlc','.resx','.razor','.json','.htm','.html','.config','.txt'} or f.stat().st_size>800000:continue
                  try: s=f.read_bytes()
                  except OSError:continue
                  if b'\x00' in s[:120]:continue
                  v=s.decode('utf-8-sig',errors='replace')
                  found=[]
                  for needle in labels:
                      if needle in v:found.append(needle)
                  if found and ('baocao' in str(f).lower() or 'report' in str(f).lower() or 'plan' in str(f).lower()):
                      rel=f.relative_to(root)
                      print('REFERENCE_FILE='+str(rel)+'; MARKERS='+','.join(found)+'; LINES='+','.join(str(n) for n,x in enumerate(v.splitlines(),1) if any(z in x for z in found))[:150])
              # Specific source-to-layout loading references and report header metadata only
              backend=root/'eman_ver3/View/Print/MD_00_BaoCaoKeHoach/BaoCaoTHDoanhThuTheoDDH_KH.aspx.cs'
              lines=backend.read_text(encoding='utf-8-sig',errors='replace').splitlines()
              for no,line in enumerate(lines[:65],1):
                  if any(k.lower() in line.lower() for k in ['Report','viewReport','Print','GetData','CreateSql','Bind','Query','Session','DataSet','DataSource','Storage','key','Layout','Load']):
                      vals=re.findall(r'"([^"]{1,160})"',line)
                      calls=re.findall(r'([A-Za-z_][\w.]+)\s*\(',line)
                      print('REPORT_BACKEND_LINE='+str(no)+'; CALLS='+','.join(calls[:6])+'; STRINGS='+','.join(x[:140] for x in vals[:5])+'; IDENTIFIERS='+','.join(re.findall(r'[A-Za-z_][\w.]+',line)[:12]))
              for f in sorted(root.glob('eman_ver3/ReportsStorage/*')):
                  if 'doanh thu' in f.name.casefold() or 'doanhthu' in f.name.casefold():
                      print('REVENUE_TEMPLATE='+str(f.relative_to(root)))
              layout=root/'eman_ver3/ReportsStorage/[KH-Cancel] Báo Cáo Tổng Hợp Doanh Thu Theo ĐĐH.repx'
              data=layout.read_text(encoding='utf-8-sig',errors='replace')
              ls=data.splitlines()
              import xml.etree.ElementTree as ET
              try:
                  tree=ET.fromstring(data)
                  print('LAYOUT_XML_PARSE=PASS; ROOT='+tree.tag)
                  for elem in tree.iter():
                      d=elem.attrib
                      values=[(k,v) for k,v in d.items() if v.strip() in ('64','81 (CH)','56','58')]
                      if values:
                          print('LAYOUT_EXACT_LABEL='+repr(values)+'; ELEMENT='+elem.tag+'; NAME='+str(d.get('Name'))+'; BINDING='+str(d.get('DataBindings'))+'; ATTRIBUTE_KEYS='+','.join(sorted(d.keys())))
              except Exception as ex:
                  print('LAYOUT_XML_PARSE=FAIL:'+str(type(ex).__name__))
              for n,line in enumerate(ls,1):
                  if re.search(r'81\s*\(\s*CH\s*\)',line,re.I):
                      print('LAYOUT_CH_LINE='+str(n)+'; LINE_CHARS='+str(len(line))+'; LEFT='+line[:200].replace('<','[').replace('>',']'))
              # Distinguish active report configuration from canceled repository template.
              for n,line in enumerate(lines[:54],1):
                  quoted=re.findall(r'"([^"]{1,200})"',line)
                  if any(w in line for w in ('nameTemp','nameRpt','task','ReportViewer1','ReportStorage','ReportSource','SqlQuery','LoadLayout','XtraReport')):
                      print('REPORT_WIRING='+str(n)+'; STRINGS='+','.join(quoted)+'; IDENTIFIERS='+','.join(re.findall(r'(?<![\w])[A-Za-z_][A-Za-z0-9_]+(?:\.[A-Za-z_][A-Za-z0-9_]+)*',line)[:15]))
              markup=root/'eman_ver3/View/Print/MD_00_BaoCaoKeHoach/BaoCaoTHDoanhThuTheoDDH_KH.aspx'
              for n,line in enumerate(markup.read_text(encoding='utf-8-sig',errors='replace').splitlines(),1):
                  if any(w in line.lower() for w in ['report','reportviewer','documentviewer']):
                      print('REPORT_MARKUP='+str(n)+'; STRINGS='+','.join(re.findall(r'"([^"]{1,100})"',line))+'; TAGS='+','.join(re.findall(r'<([A-Za-z0-9:]+)',line)))
              # Detect reports of same friendly name and the active report API loader.
              for needle in ('class PrintAnco2','exportDataWithType(','ReportsStorage','new XtraReport('):
                  matches=[]
                  for f in files:
                      if f.suffix.lower() not in {'.cs','.ashx','.aspx'} or f.stat().st_size>200000:continue
                      try:v=f.read_text(encoding='utf-8-sig',errors='replace')
                      except Exception:continue
                      if needle in v:
                          matches.append(str(f.relative_to(root)))
                  print('LOADER_REFERENCE='+needle+'; MATCH_COUNT='+str(len(matches))+'; MATCH_FILES='+','.join(matches[:15]))
              print('INSPECTION_WIRING_COMPLETE=YES')
              print('INSPECTION_EXTENDED_COMPLETE=YES')
              print('INSPECTION_COMPLETE=YES')
          PY
