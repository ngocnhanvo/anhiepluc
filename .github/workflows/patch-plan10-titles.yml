name: AnHiepLuc - PLAN10 title update guarded
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Validate report title patch script
        run: python3 -m py_compile scripts/patch_plan10_titles_56_58.py
      - name: Verify title patch without Azure writes
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          REPORT_TITLE_MODE: preview
        run: python3 scripts/patch_plan10_titles_56_58.py
