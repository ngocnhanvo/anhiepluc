name: AnHiepLuc - encrypted inspect report source
on:
  push:
    paths:
      - .github/workflows/secure-inspect-revenue-order.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install encryptor
        run: python3 -m pip install -q 'cryptography>=43,<50'
      - name: Inspect Azure source with encrypted output only
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,base64,subprocess,tempfile,pathlib,hashlib,codecs,json,zlib
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          pub=serialization.load_pem_public_key("-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA2fn8CpNuZIIy71LABRJ/\n+dSXn9qKsbl+cSAOOJXq7CUofB1DtRM6yoJ2TF/9GFiosWhOUbTFe8IpcxQpbj//\nxz8+S4EkoQ5mwaD/tLmR8sfkCegJ0Woj3xQNLezOaEkrKbCYC10o/TEJhPHiZSHY\n7kO3KjhiIzawWC3ZIFYHB9k/l09sspdrzfPHP8p6fkrBx6RvZUPiK6RvHFzgTJGB\nvKF+/UzOIK5QmNnyrG6nlP+kl+0cgzKNHiOt2dDX8k8wflna86CQKj3NCNBqJf+f\nLbELOqrXReEBxI+W5FhtWrIOXJ3FcliOymtAntQWpqCl5lkK6uCIvTaqMYP6jtN7\njwIDAQAB\n-----END PUBLIC KEY-----".encode())
          token=os.getenv('AZURE_DEVOPS_PAT')
          if not token: raise RuntimeError('MISSING_PAT')
          env=os.environ.copy()
          env['AZURE_GIT_HEADER']='AUTHORIZATION: Basic '+base64.b64encode((':'+token).encode()).decode()
          with tempfile.TemporaryDirectory() as td:
              base=pathlib.Path(td)/'src'
              url='https://dev.azure.com/vongocnhancd10cntt2/AnHiepLuc/_git/AnHiepLuc'
              p=subprocess.run(['git','--config-env=http.extraheader=AZURE_GIT_HEADER','clone','--quiet','--depth=1','--branch=master',url,str(base)],env=env,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
              if p.returncode: raise RuntimeError('AZURE_CLONE_FAILED')
              sha=subprocess.check_output(['git','-C',str(base),'rev-parse','HEAD'],text=True).strip()
              paths=[
                'eman_ver3/View/Print/MD_00_BaoCaoKeHoach/BaoCaoTHDoanhThuTheoDDH_KH.aspx.cs',
                'eman_ver3/View/Print/MD_00_BaoCaoKeHoach/BaoCaoTHDoanhThuTheoDDH_KH.aspx',
                'eman_ver3/View/Print/MD_00_BaoCaoKeHoach/BaoCaoCTDoanhThuTheoMHH_KH.aspx.cs'
              ]
              data={'sha':sha,'files':{}}
              for rel in paths:
                  f=base/rel
                  raw=f.read_bytes()
                  for enc in ('utf-8-sig','utf-16','cp1258'):
                      try:
                          txt=raw.decode(enc);break
                      except UnicodeDecodeError:continue
                  data['files'][rel]={'encoding':enc,'sha256':hashlib.sha256(raw).hexdigest(),'body':txt}
              key=AESGCM.generate_key(bit_length=256)
              nonce=os.urandom(12)
              msg=zlib.compress(json.dumps(data,ensure_ascii=False).encode(),9)
              ct=AESGCM(key).encrypt(nonce,msg,None)
              wrapped=pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
              serial={'wrapped':base64.b64encode(wrapped).decode(),'nonce':base64.b64encode(nonce).decode(),'ciphertext':base64.b64encode(ct).decode()}
              print('READONLY_AZURE_SOURCE=PASS')
              print('AZURE_MASTER_SHA='+sha)
              print('ENCRYPTED_SOURCE_REPORT='+json.dumps(serial,separators=(',',':')))
              print('REPORT_COMPLETE=YES')
          PY
